name: Set up the workspace
description: Bun, the workspace dependencies, and optionally Chromium for Playwright (cached by lockfile).

inputs:
  browsers:
    description: Install Chromium and its system dependencies for the Playwright suites.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json
    - run: bun ci
      shell: bash

    - name: Cache Playwright browsers
      if: inputs.browsers == 'true'
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
    - name: Install Chromium
      if: inputs.browsers == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      run: bun playwright install --with-deps chromium
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    - name: Install Chromium system dependencies
      if: inputs.browsers == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
      run: bun playwright install-deps chromium
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
