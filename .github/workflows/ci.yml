name: CI

# Full validation, once per change, on the pull request: every app in apps/ and the libraries in
# packages/ together, since the apps build the libraries from source. The `CI` job sums up the
# others and is the one check main requires before auto-merge, so every pull request runs it (a
# required check that never runs would leave the pull request pending). Merges to main are not
# re-validated; a release re-runs the fast checks before publishing the Docker image (see
# docker-publish.yml). The dashboard's ambient-controller suite runs nightly.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Build, type-check, lint, unit tests & boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bun run build
      - run: bun check --no-pretty
      - run: bun run lint
      - run: bun test
      - run: bun run check:boundaries

  browser:
    name: Browser tests (${{ matrix.suite.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: dashboard, run: bun run test:dashboard:e2e }
          - { name: weather-map, run: bun run test:weather-map:e2e }
          - { name: weather-clock, run: bun run test:weather-clock:e2e }
          # The radar and ambient fixtures against production builds. The radar's cloud-rendering
          # visual suite is not run here: its baselines are Windows-rendered.
          - { name: libraries, run: bun run test:libraries:e2e }
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          browsers: 'true'
      - run: ${{ matrix.suite.run }}
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics-${{ matrix.suite.name }}-${{ github.sha }}
          path: |
            apps/*/playwright-report
            apps/*/test-results
            packages/*/playwright-report
            packages/*/test-results
          if-no-files-found: ignore

  result:
    name: CI
    if: always()
    needs: [checks, browser]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
